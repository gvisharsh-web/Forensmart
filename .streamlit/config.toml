# ============================================================================
# STREAMLIT CONFIGURATION
# ============================================================================

[client]
showErrorDetails = true
toolbarMode = "minimal"
showSidebarNavigation = true
primaryColor = "#FF6B35"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"

[server]
port = 8501
headless = true
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true
enableCORS = true
enableWebsocketCompression = true

[logger]
level = "info"
messageFormat = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

[theme]
primaryColor = "#FF6B35"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[mapbox]
token = ""

[deprecation]
showPyplotGlobalUse = false
showfileRerunButton = true
showImageCompression = true

[client.toolbarMode]
# Possible values: "auto", "minimal", "viewer"
value = "minimal"

[client.showErrorDetails]
value = true

[client.showSidebarNavigation]
value = true

[client.showRunningSessionButton]
value = true

[client.showPyplotGlobalUse]
value = false
