[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forensmart"
version = "2.0.0"
description = "Professional Digital Forensic Analysis Platform"
requires-python = ">=3.9"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "W"]
